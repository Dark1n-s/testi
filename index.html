<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій Магазин</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .product { border: 1px solid #ccc; padding: 15px; margin-bottom: 10px; border-radius: 5px; }
        button { background: #28a745; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; }
        .cart { margin-top: 30px; padding: 20px; background: #f8f9fa; border-radius: 5px; }
        input { padding: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <h1>Каталог товарів</h1>
    <div id="products">Завантаження...</div>

    <div class="cart">
        <h2>Оформлення замовлення</h2>
        <input type="text" id="name" placeholder="Ваше ім'я">
        <input type="text" id="phone" placeholder="Ваш телефон">
        <button onclick="checkout()">Купити</button>
    </div>

    <script>
        // Ваше реальне посилання на бекенд
        const API_URL = 'https://testi-olt0.onrender.com/api';
        let cart = [];

        async function loadProducts() {
            try {
                const res = await fetch(`${API_URL}/products/`);
                const products = await res.json();
                const container = document.getElementById('products');
                container.innerHTML = '';
                
                products.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'product';
                    div.innerHTML = `
                        <h3>${p.name} — ${p.price} грн</h3>
                        <p>Залишок: ${p.stock} шт.</p>
                        <button onclick="addToCart(${p.id})">В кошик</button>
                    `;
                    container.appendChild(div);
                });
            } catch (error) {
                document.getElementById('products').innerText = 'Помилка завантаження товарів. Сервер ще запускається.';
            }
        }

        function addToCart(productId) {
            cart.push({ product_id: productId, quantity: 1 });
            alert('Товар додано в кошик!');
        }

        async function checkout() {
            const name = document.getElementById('name').value;
            const phone = document.getElementById('phone').value;

            if (!name || !phone || cart.length === 0) {
                alert('Заповніть ім\'я, телефон та додайте товар у кошик.');
                return;
            }

            const res = await fetch(`${API_URL}/orders/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    customer_name: name,
                    customer_phone: phone,
                    items: cart
                })
            });

            if (res.ok) {
                alert('Замовлення успішно створено!');
                cart = [];
                document.getElementById('name').value = '';
                document.getElementById('phone').value = '';
                loadProducts(); // Оновлюємо залишки на екрані
            } else {
                alert('Помилка оформлення. Можливо, товару немає на складі.');
            }
        }

        loadProducts();
    </script>
</body>
</html>
